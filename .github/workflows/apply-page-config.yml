name: Apply Power BI page configuration

on:
  push:
    branches:
      - feature/powerbi-page-config

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/powerbi-page-config
          fetch-depth: 0

      - name: Apply dashboard page field
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/routes/_authenticated/admin.tsx")
          text = path.read_text(encoding="utf-8")

          replacements = [
            (
              '  report_id: "",\n  sort_order: 0,',
              '  report_id: "",\n  page_name: "",\n  sort_order: 0,'
            ),
            (
              '        report_id: editing.report_id ?? "",\n        sort_order: editing.sort_order,',
              '        report_id: editing.report_id ?? "",\n        page_name: editing.page_name ?? "",\n        sort_order: editing.sort_order,'
            ),
            (
              '              <Field label="Report ID (SDK)">\n                <Input\n                  value={form.report_id}\n                  onChange={(e) => setForm({ ...form, report_id: e.target.value })}\n                />\n              </Field>\n            </div>',
              '              <Field label="Report ID (SDK)">\n                <Input\n                  value={form.report_id}\n                  onChange={(e) => setForm({ ...form, report_id: e.target.value })}\n                />\n              </Field>\n            </div>\n            <Field label="Page Name (Power BI)">\n              <Input\n                value={form.page_name}\n                onChange={(e) => setForm({ ...form, page_name: e.target.value })}\n                placeholder="Ex.: ReportSection..."\n              />\n            </Field>'
            )
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"Expected text not found in admin.tsx: {old[:80]}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")

      - name: Update generated Supabase dashboard type
        shell: python
        run: |
          from pathlib import Path
          path = Path("src/integrations/supabase/types.ts")
          text = path.read_text(encoding="utf-8")
          old = '          report_id: string | null\n          sort_order: number'
          new = '          report_id: string | null\n          page_name: string | null\n          sort_order: number'
          if old not in text:
              raise SystemExit("Dashboard Row type marker not found")
          text = text.replace(old, new, 1)
          old = '          report_id?: string | null\n          sort_order?: number'
          new = '          report_id?: string | null\n          page_name?: string | null\n          sort_order?: number'
          if old not in text:
              raise SystemExit("Dashboard Insert type marker not found")
          text = text.replace(old, new, 1)
          old = '          report_id?: string | null\n          sort_order?: number'
          new = '          report_id?: string | null\n          page_name?: string | null\n          sort_order?: number'
          if old not in text:
              raise SystemExit("Dashboard Update type marker not found")
          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")

      - name: Commit generated changes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/routes/_authenticated/admin.tsx src/integrations/supabase/types.ts .github/workflows/apply-page-config.yml
          git rm --cached .github/workflows/apply-page-config.yml
          git add -- src/routes/_authenticated/admin.tsx src/integrations/supabase/types.ts
          git commit -m "feat: add Power BI page name to dashboard admin"
          git push origin feature/powerbi-page-config
