<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Microsoft Authentication</title>
  </head>
  <body>
    <p>Processando autenticação...</p>

    <script>
      (function () {
        "use strict";

        /*
         * MSAL Browser v5 redirect bridge.
         *
         * Esta página precisa ser completamente independente do React,
         * TanStack Router e Supabase. Ela recebe a resposta OAuth no hash
         * e a transmite para a janela que iniciou loginPopup/acquireTokenPopup.
         */

        function base64Decode(input) {
          var value = input.replace(/-/g, "+").replace(/_/g, "/");

          switch (value.length % 4) {
            case 0:
              break;
            case 2:
              value += "==";
              break;
            case 3:
              value += "=";
              break;
            default:
              throw new Error("invalid_base64_string");
          }

          var binary = atob(value);
          var bytes = new Uint8Array(binary.length);

          for (var i = 0; i < binary.length; i += 1) {
            bytes[i] = binary.charCodeAt(i);
          }

          return new TextDecoder().decode(bytes);
        }

        function parseResponse() {
          var hash = window.location.hash || "";
          var query = window.location.search || "";

          var hashParams =
            hash.length > 1
              ? new URLSearchParams(hash.substring(1))
              : null;

          var queryParams =
            query.length > 1
              ? new URLSearchParams(query.substring(1))
              : null;

          var params = null;
          var payload = "";

          if (hashParams && hashParams.has("state")) {
            params = hashParams;
            payload = hash.substring(1);
          }

          if (queryParams && queryParams.has("state")) {
            params = queryParams;
            payload = query.substring(1);
          }

          if (!params || !payload) {
            throw new Error("redirect_bridge_empty_response");
          }

          var state = params.get("state");

          if (!state) {
            throw new Error("no_state_in_hash");
          }

          var libraryStateEncoded = state.split("|")[0];
          var libraryState = JSON.parse(
            base64Decode(libraryStateEncoded),
          );

          if (!libraryState.id || !libraryState.meta) {
            throw new Error("unable_to_parse_state");
          }

          return {
            channelId: libraryState.id,
            payload: payload,
          };
        }

        try {
          var response = parseResponse();
          var channel = new BroadcastChannel(response.channelId);

          channel.postMessage({
            v: 1,
            payload: response.payload,
          });

          channel.close();

          console.info("[ENTRA BRIDGE] Resposta Microsoft enviada ao portal.");

          window.history.replaceState(
            null,
            "",
            window.location.origin + window.location.pathname,
          );

          window.close();
        } catch (error) {
          console.error(
            "[ENTRA BRIDGE] Não foi possível processar a resposta Microsoft:",
            error,
          );
        }
      })();
    </script>
  </body>
</html>
